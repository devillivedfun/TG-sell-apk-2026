<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyxGram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(14, 165, 233, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 50%, #bae6fd 100%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4), 0 0 70px rgba(14, 165, 233, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .logo-wrapper:hover {
      transform: scale(1.04);
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.6), 0 0 90px rgba(14, 165, 233, 0.3);
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background-color: #000;
    }
    .bot-name {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    @media (max-width: 480px) {
      .logo-wrapper {
        width: 140px;
        height: 140px;
      }
      .bot-name {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="logo-wrapper">
      <img src="/logo.jpg" alt="NyxGram Logo" class="logo-img" />
    </div>
    <h1 class="bot-name">NyxGram</h1>
  </div>
</body>
</html>
